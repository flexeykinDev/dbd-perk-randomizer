version: 2

# Weekly, grouped, and deliberately not auto-merged.
#
# Grouped because eleven separate PRs for eleven bumps is eleven CI runs and
# eleven things to look at, and nobody looks at the eleventh. Two groups
# rather than one: a dev-only bump can break the build or the tests and
# nothing else, while a prod bump ships to visitors — those deserve different
# amounts of attention, and keeping them apart means the risky half can be
# held without also holding a Playwright patch release.
#
# Not auto-merged, unlike the perk scrape. That one merges itself because its
# diff is verifiable — the workflow checks the data only grew and nothing
# existing changed. A dependency bump has no such property: CI passing means
# the tests we happened to write still pass, which is not the same as the
# release being fine. Next minor bumps have broken the static export here
# before.
#
# No `open-pull-requests-limit` for npm beyond the default: with grouping,
# there is at most one PR per group per run anyway.
#
# Monthly, not weekly. Grouping already took eleven PRs down to three, but
# three a week is still twelve a month, and twelve batches a month is more
# often than anyone here actually wants to read a changelog - the September
# run produced #11, #12 and #13 on the same morning and they sat until
# October. A batch nobody opens is worse than a batch that waits: it trains
# you to ignore the thing that is supposed to be asking for attention.
#
# What this does NOT slow down is security. Dependabot security updates come
# from advisories, not from this schedule, and still open as soon as one lands
# against something in the lockfile. This only paces routine version bumps.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      # 07:00 keeps a batch clear of the perk scrape's own PR, which opens at
      # 06:00 (see update-perks.yml) - a scrape that needs a human look should
      # not be competing for attention with a dependency batch. `day` is a
      # weekly-only setting and is gone with the weekly interval; a monthly
      # schedule runs on the day of the month it first ran.
      time: "07:00"
      timezone: Etc/UTC
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development

    # Three majors that cannot be taken yet. Held here rather than closed
    # by hand every Tuesday, because a grouped PR is all-or-nothing: one
    # unmergeable bump holds the eight safe ones hostage.
    ignore:
      # Both are decided by eslint-config-next, which is pinned to next's
      # version and brings its own tooling. typescript-eslint 8.71 — the
      # newest that exists — supports TypeScript >=4.8.4 <6.1.0, so TS 7
      # fails lint outright. eslint-plugin-react, bundled in the same
      # config, still calls context.getFilename(), which eslint 10 removed.
      # Neither is a setting in this repo. They unblock when a newer
      # eslint-config-next ships, which follows next.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # This one tracks the Node that CI, the deploy and the scrapers all
      # run on — 22, see the workflows — not the newest release line.
      # Typing against Node 26 APIs the runtime does not have is how you
      # get a green build that throws in production.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

    commit-message:
      # Matches the scrape bot's prefix, which is the only other automated
      # committer here. Everything written by a person is a plain sentence —
      # see CONTRIBUTING.
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly for the same reason as npm above, and with one of its own: an
      # Actions bump is almost never urgent, and most of what it touches -
      # the Pages deploy, the scrape bot's PR step - is not exercised by a
      # pull request at all, so each batch costs a careful read rather than a
      # glance at a green check.
      interval: monthly
      time: "07:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
