# Housekeeping for the OBS overlay rooms in Firebase.
#
# Deliberately its own workflow rather than a step on the weekly data
# scrape: it touches a live database, and it should never be able to fail
# a run whose job is opening a data PR.
#
# Safe to run because a room code is not the room's data — the code lives
# in the streamer's localStorage and in the URL pasted into OBS, so a
# pruned room is recreated on their next publish and their Browser Source
# never breaks. See scripts/prune-obs-rooms.ts.
name: Prune stale OBS rooms

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, an hour before the data scrape
  workflow_dispatch:
    inputs:
      days:
        description: "Delete rooms untouched for this many days"
        default: "14"
        required: false
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Listing rooms needs FIREBASE_DB_SECRET: the database rules refuse to
      # enumerate room codes to anyone, since a code is what lets you write
      # to that streamer's overlay. Without the secret the script skips
      # cleanly rather than failing — see scripts/prune-obs-rooms.ts.
      - name: Prune
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: >
          npx tsx scripts/prune-obs-rooms.ts
          --days=${{ github.event.inputs.days || '14' }}
          ${{ github.event.inputs.dry_run == 'true' && ' ' || '--delete' }}
