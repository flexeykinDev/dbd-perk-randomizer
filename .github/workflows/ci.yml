name: CI

on:
  pull_request:
    # Not the scrape bot's branch. Its PRs land in "waiting for approval" and
    # never get one, so the run sits with zero jobs until the branch is
    # deleted and then reports failure — 25 hours on 21 September, 83 on
    # 7 September, both ending within a second of the PR being merged. The
    # job timeout below never applied, because there was never a job.
    #
    # A check that cannot run is worse than no check: it puts a permanent red
    # X on every scrape and trains you to ignore the one that matters. The
    # scrape's data is validated inside update-perks.yml, by the same lint,
    # test and build this workflow runs, before it will merge anything.
    branches-ignore: [auto/update-perks]
  push:
    branches: [main]

# One run per branch. A second push while the first is still going makes the
# first irrelevant, and leaving it to finish costs a runner and muddies which
# result belongs to the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Without this a hung step runs to GitHub's 6-hour default, and the only
    # way to notice is to go looking. A healthy run is under two minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (static export, includes typecheck)
        run: npm run build

      # Straight after the build, before the slower browser work: a bundle
      # that has grown past its budget is worth knowing about in seconds
      # rather than after Playwright has finished. The number is printed
      # whether it passes or not, so a PR diff shows it moving — one that
      # only appeared on failure would be one nobody watches.
      - name: Bundle size budget
        run: npm run check:bundle

      # Cached against the installed Playwright version, since that is what
      # decides which browser build is needed — a lockfile change that
      # doesn't move Playwright shouldn't cost another download.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Deliberately no --with-deps. That flag runs apt-get, and apt-get is
      # what was actually hanging this job — three times, for up to six
      # hours, while the failure looked like a slow browser download. The
      # log is unambiguous: every library Chromium needs is already present
      # on the runner image ("is already the newest version"), and the only
      # new packages were nine font packages totalling 21 MB, fetched from
      # an Ubuntu mirror that took four minutes for a single 3.5 MB file.
      #
      # Those fonts exist to render CJK and emoji glyphs in screenshots.
      # These tests read the DOM, so nothing here depends on them, and
      # skipping apt removes the failure rather than bounding it. If a
      # genuinely missing library ever breaks Chromium's launch, the e2e
      # step fails immediately and says so, which is a much better signal
      # than a job that hangs.
      - name: Install Playwright browsers
        run: npx playwright install chromium
        timeout-minutes: 8

      # `npx playwright test`, not `npm run test:e2e`: the suite now runs
      # against the static export in out/ rather than a dev server, and the
      # build step above has already produced it. The npm script rebuilds
      # first, which is what you want locally and a wasted minute here.
      - name: E2E smoke tests
        run: npx playwright test
