name: Update DBD perk data

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape perks from the DBD wiki
        run: npm run scrape:perks
      - name: Open PR with updated perk data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update DBD perk data from wiki"
          title: "Update DBD perk data"
          body: |
            Automated weekly scrape of the [DBD wiki Perks page](https://deadbydaylight.fandom.com/wiki/Perks).

            Review the icon/name/description/character-portrait diff before merging.
          branch: auto/update-perks
          add-paths: |
            data/perks.json
            data/meta.json
            data/characters.json
            public/perks/**
            public/characters/**
